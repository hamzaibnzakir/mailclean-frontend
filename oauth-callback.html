<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MailClean — Connecting Gmail...</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #faf8f4; }
    .box { text-align: center; padding: 40px; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e5e5e5; border-top-color: #1a1714; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #6b6760; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Connecting Gmail account...</p>
  </div>
  <script>
    // Save OAuth params to sessionStorage so GmailSection can read after redirect
    sessionStorage.setItem('gmail_redirect', window.location.search);
    // Redirect to app — go to settings tab
    window.location.replace('/app');
  </script>
</body>
</html>
