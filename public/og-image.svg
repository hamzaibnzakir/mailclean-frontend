  <text x="848" y="258" font-family="monospace" font-size="12" fill="#1a1714">john@acme.com</text>
  <rect x="1030" y="243" width="65" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="1062" y="258" font-family="monospace" font-size="10" fill="#166534" text-anchor="middle">delivers</text>

  <text x="848" y="295" font-family="monospace" font-size="12" fill="#1a1714">info@store.com</text>
  <rect x="1030" y="280" width="65" height="22" rx="11" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="1062" y="295" font-family="monospace" font-size="10" fill="#78350f" text-anchor="middle">unknown</text>

