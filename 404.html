<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MailClean</title>
    <script>
      var l = window.location;
      var path = l.pathname;
      // Keep /privacy, /terms, /app paths working
      l.replace(
        l.protocol + '//' + l.host + '/?path=' + encodeURIComponent(path) + (l.search ? '&' + l.search.slice(1) : '') + l.hash
      );
    </script>
  </head>
  <body></body>
</html>
